<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scots on Fire</title>
<style>
  :root {
    --garnet: #640A28;
    --garnet-dark: #3d0618;
    --orange: #FF6600;
    --orange-soft: #ff9a4d;
    --cream: #fff4e8;
    --ink: #111;
    --bad: #e02424;
    --good: #2ecc71;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    overflow: hidden;
    background: #111;
    color: var(--cream);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  canvas, #game-canvas {
    position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; display: block; z-index: 0;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    text-shadow: 0 2px 3px rgba(0,0,0,.6);
  }
  .panel {
    background: linear-gradient(180deg, rgba(100,10,40,.88), rgba(61,6,24,.88));
    border: 2px solid var(--orange);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
    padding: 8px 12px;
  }
  #hud-left {
    position: absolute; top: 14px; left: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 240px;
  }
  #hud-level { font-weight: 800; font-size: 16px; letter-spacing: .5px; color: var(--orange-soft); text-transform: uppercase; }
  .bar-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; opacity: .9; display: flex; justify-content: space-between; }
  .bar {
    height: 14px; border-radius: 7px; background: rgba(0,0,0,.55); overflow: hidden; margin-top: 4px;
    border: 1px solid rgba(255,255,255,.2);
  }
  .bar-fill {
    height: 100%; width: 100%; border-radius: 7px;
    background: linear-gradient(90deg, var(--orange), #ffb347);
    transition: width .2s ease, background .2s;
  }
  #hp-fill.low { background: linear-gradient(90deg, #b30000, var(--bad)); animation: pulse .6s infinite alternate; }
  #hud-ammo { display: flex; gap: 14px; font-size: 18px; font-weight: 800; }
  #hud-ammo span { display: inline-flex; align-items: center; gap: 4px; }
  #hud-boost {
    display: none; align-self: flex-start;
    background: linear-gradient(90deg, #ffd000, var(--orange)); color: #2a0010;
    font-weight: 900; font-size: 14px; letter-spacing: 1px; padding: 4px 10px; border-radius: 999px;
    box-shadow: 0 0 14px rgba(255,200,0,.8); text-shadow: none;
    animation: pulse .4s infinite alternate;
  }
  #hud-boost.on { display: inline-block; }

  #hud-right { position: absolute; top: 14px; right: 14px; text-align: right; }
  #hud-timer { font-size: 32px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: 1px; min-width: 110px; text-align: center; }
  #hud-timer.warn { color: #ff4040; border-color: #ff4040; animation: flash .5s infinite alternate; }

  #hud-objective {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700; max-width: 46vw; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #hud-objective:empty { display: none; }

  #boss-wrap {
    display: none; position: absolute; top: 64px; left: 50%; transform: translateX(-50%); width: min(520px, 80vw);
    border-color: #9b59ff; background: linear-gradient(180deg, rgba(60,20,100,.9), rgba(30,8,55,.9));
  }
  #boss-wrap.on { display: block; }
  #boss-fill { background: linear-gradient(90deg, #6a1fd1, #b07cff); }

  #hud-controls {
    display: none; position: absolute; bottom: 12px; left: 12px; font-size: 13px; font-weight: 600;
    padding: 6px 10px; opacity: .92;
  }
  #hud-controls.on { display: block; }

  #toast {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%) scale(.9);
    font-size: 28px; font-weight: 900; color: #fff; padding: 10px 22px; opacity: 0;
    transition: opacity .2s, transform .2s; white-space: nowrap;
  }
  #toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---------- Screens ---------- */
  #screen {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(100,10,40,.82) 0%, rgba(17,17,17,.94) 75%);
    padding: 16px;
  }
  #screen.on { display: flex; }
  #screen-card {
    max-width: 640px; width: 100%; text-align: center; padding: 34px 30px 30px;
    background: linear-gradient(180deg, rgba(100,10,40,.96), rgba(40,4,16,.96));
    border: 3px solid var(--orange); border-radius: 18px;
    box-shadow: 0 0 40px rgba(255,102,0,.45), 0 10px 40px rgba(0,0,0,.6);
    animation: pop .25s ease-out;
  }
  #screen-title {
    margin: 0 0 14px; font-size: clamp(34px, 7vw, 60px); font-weight: 900; line-height: 1.05; letter-spacing: 1px;
    color: var(--orange);
    text-shadow: 0 0 18px rgba(255,102,0,.6), 0 3px 0 var(--garnet-dark);
  }
  #screen-body { font-size: 17px; line-height: 1.5; margin: 0 0 24px; color: var(--cream); }
  #screen-body p { margin: 0 0 10px; }
  #screen-body b, #screen-body strong { color: var(--orange-soft); }
  #screen-btn {
    font: inherit; font-size: 20px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
    color: #fff; background: linear-gradient(180deg, #ff7a1f, #e04e00);
    border: 2px solid #ffd2b0; border-radius: 12px; padding: 12px 34px; cursor: pointer;
    box-shadow: 0 5px 0 #8a2b00, 0 8px 20px rgba(0,0,0,.4);
    transition: transform .08s, box-shadow .08s;
  }
  #screen-btn:hover { filter: brightness(1.1); }
  #screen-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a2b00; }
  #screen-hint { margin-top: 12px; font-size: 12px; opacity: .65; }

  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.45); } }
  @keyframes flash { from { opacity: 1; } to { opacity: .35; } }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  @media (max-width: 640px) {
    #hud-left { min-width: 170px; }
    #hud-objective { top: 70px; max-width: 90vw; font-size: 13px; }
    #hud-timer { font-size: 22px; min-width: 80px; }
    #hud-controls { font-size: 11px; }
  }
</style>
</head>
<body>
  <div id="hud">
    <div id="hud-left">
      <div class="panel">
        <div id="hud-level">Level 1: Campus Dash</div>
        <div class="bar-label" style="margin-top:6px"><span>HP</span><span id="hp-text">100 / 100</span></div>
        <div class="bar"><div class="bar-fill" id="hp-fill"></div></div>
      </div>
      <div class="panel" id="hud-ammo">
        <span title="Extinguisher">🧯 <b id="ammo-ext">0</b></span>
        <span title="Vial">🧪 <b id="ammo-vial">0</b></span>
      </div>
      <div id="hud-boost">⚡ SPEED</div>
    </div>
    <div id="hud-objective" class="panel"></div>
    <div id="hud-right"><div id="hud-timer" class="panel">0:00</div></div>
    <div id="boss-wrap" class="panel">
      <div class="bar-label"><span>🐯 SEWANEE TIGER</span><span id="boss-text"></span></div>
      <div class="bar"><div class="bar-fill" id="boss-fill"></div></div>
    </div>
    <div id="toast" class="panel"></div>
    <div id="hud-controls" class="panel"></div>
  </div>

  <div id="screen">
    <div id="screen-card">
      <h1 id="screen-title">Scots on Fire</h1>
      <div id="screen-body"></div>
      <button id="screen-btn" type="button">Play</button>
      <div id="screen-hint">Press Enter or Space</div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assests/models.js"></script>
<script src="ui.js"></script>
<script src="levels.js"></script>
<script src="entities.js"></script>
<script src="game.js"></script>
</body>
</html>
